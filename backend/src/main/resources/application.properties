spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.upload.base-url=${BACKEND_BASE_URL:http://localhost:8080}/uploads/
app.upload.dir=${UPLOAD_DIR:uploads}
app.avatar.upload-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.password-reset.expiration-minutes=30
